<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <section id="form">
        <h1>Add Product</h1>
        <form id="productForm">
            <label for="product-name">Product:</label>
            <input type="text" placeholder="Eg. Computer" id="product-name" required>
            <label for="quantity">Quantity:</label>
            <input type="number" placeholder="Eg. 2" id="quantity" required> 
            <label for="price">Price:</label>
            <input type="number" placeholder="Eg. 12.5" id="price" required>
            <button class="btn btn-primary" type="submit">submit</button>
        </form>
    </section>
    <section id="table">
        <table class="table">
            <thead>
                <tr>
                    <th class="m-5">Product Name</th>
                    <th class="m-5">Quantity</th>
                    <th class="m-5">Price per Item</th>
                </tr>
            </thead>
            <tbody id="productTableBody">

            </tbody>
            <tr><td>Overall Total: </td><td></td> <td id="overAllTotal">0.00</td></tr>
        </table>
    </section>
</body>
<script>
    const tableBody = document.getElementById('productTableBody');
    const overAllTotal = document.getElementById('overAllTotal');

    function loadProducts(){
        fetch('/getProducts')
        .then(response => response.json())
        .then(data => {
            console.log(data.products);
            console.log(data.overAllTotal);
            tableBody.innerHTML = '';
            data.products.forEach(product => {
                const row = document.createElement("tr");
                            row.innerHTML = `
                                <td>${product.product}</td>
                                <td>${product.quantity}</td>
                                <td>${Number(product.price).toFixed(2)}</td>
                            `;
                            tableBody.appendChild(row);
            });
            overAllTotal.textContent = Number(data.overAllTotal);
        })
    }
    loadProducts();

    const productForm = document.getElementById('productForm');

    productForm.addEventListener('submit', function(event){
        event.preventDefault();

        const data ={
            product: document.getElementById('product-name').value,
            quantity: Number(document.getElementById('quantity').value),
            price: Number(document.getElementById('price').value),
        }

        console.log(data);
        fetch('/insertProduct',{
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'Accept':'application/json',
            },
            body: JSON.stringify(data)
        })

        .then(async response => {
            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    JSON.stringify(data.errors || data.message || data)
                );
            }
            return data;
        })

        .then(data => {
            productForm.reset();
            loadProducts();
        })
    })
</script>
</html>
